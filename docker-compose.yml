services:
  whisper-api:
    build: .
    image: whisper-api:local
    env_file: .env
    volumes:
      - ./whisper-api.conf:/srv/whisper-api.conf:ro
    ports:
      - "${WHISPER_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
